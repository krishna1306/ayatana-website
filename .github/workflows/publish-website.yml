name: Publish Website Branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-website
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ci-website
    env:
      PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL || secrets.PUBLIC_API_URL }}
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate required environment
        run: |
          if [ -z "$PUBLIC_API_URL" ]; then
            echo "::error::PUBLIC_API_URL is not configured. Set repo variable or secret PUBLIC_API_URL."
            exit 1
          fi

      - name: Validate source
        run: npm run check

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Make sure website branch is available
        run: git fetch origin website:website

      - name: Build and stage website branch
        run: npm run publish:website -- --message="Publish website from ${GITHUB_SHA}"

      - name: Push website branch
        run: git push origin website
